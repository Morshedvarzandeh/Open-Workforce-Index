[workspace]
members = [
    "crates/workforce-domain",
    "crates/workforce-engine",
    "crates/workforce-kg",
    "crates/workforce-store",
    "crates/workforce-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
authors = ["Morshed Varzandeh"]
repository = "https://github.com/Morshedvarzandeh/Open-Workforce-Index"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
oxigraph = { version = "0.5.9", default-features = false }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
