name: Hosted service
on:
  pull_request:
  push:
    branches: [main]
    paths: ['tools/**', 'hosting/**', 'crates/**', 'ontology/**', 'examples/**', 'Cargo.*', '.dockerignore', '.github/workflows/hosted.yml']
permissions:
  contents: read
concurrency:
  group: hosted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hosted boundaries
        run: python3 tools/test_hosted.py
      - name: Build hosted image
        run: docker build -f hosting/Dockerfile -t owi-hosted-test .
      - name: Verify real engine through hosted HTTP
        run: docker run --rm owi-hosted-test python tools/check_hosted_engine.py
      - name: Verify production HTTP entry point
        run: |
          container=$(docker run -d -p 127.0.0.1:8080:8080 owi-hosted-test)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/ | python3 -c 'import sys; assert "No download needed" in sys.stdin.read()'
